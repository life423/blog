name: Build and Deploy Container App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_REPOSITORY: docker.io/aiandrew631/blog
  CONTAINER_APP_NAME: blogportfolio
  AZURE_RESOURCE_GROUP: portfolio-apps

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify application
        run: |
          npm ci
          npm run check
          npm test

  build:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REPOSITORY }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check production configuration
        id: preflight
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          STORAGE=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.template.containers[0].env[?name=='AZURE_STORAGE_ACCOUNT'].value | [0]" -o tsv)
          PORT=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query 'properties.configuration.ingress.targetPort' -o tsv)
          HASH_REF=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.template.containers[0].env[?name=='ADMIN_PASSWORD_HASH'].secretRef | [0]" -o tsv)
          SESSION_REF=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.template.containers[0].env[?name=='ADMIN_SESSION_SECRET'].secretRef | [0]" -o tsv)
          if [ -z "$STORAGE" ] || [ "$PORT" != '8080' ] || [ -z "$HASH_REF" ] || [ -z "$SESSION_REF" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Deployment skipped: configure storage, managed identity, administrator secrets, and Node ingress port before rollout.'
            echo '### Deployment skipped' >> "$GITHUB_STEP_SUMMARY"
            echo 'The immutable image was built, but the live revision was not changed. Production storage, administrator secrets, and ingress port 8080 must be configured before rollout.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Update Container App revision
        if: steps.preflight.outputs.ready == 'true'
        env:
          IMAGE_TAG: ${{ env.DOCKER_REPOSITORY }}:${{ github.sha }}
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_TAG"
