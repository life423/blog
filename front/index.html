<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Beyond the Stack: AI & Engineering Insights</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />

        <link
            rel="icon"
            href="assets/images/favicons/favicon-32x32.png"
            type="image/png"
        />
        <link
            rel="apple-touch-icon"
            href="assets/images/favicons/apple-touch-icon.png"
        />

        <link rel="stylesheet" href="style/colors.css" />
        <link rel="stylesheet" href="style/main.css" />
    </head>
    <body>
        <div class="container">
            <header class="site-header">
                <h1 class="title">Beyond the Stack</h1>

                <button
                    class="menu-toggle"
                    type="button"
                    aria-label="Open navigation"
                    aria-controls="nav-drawer"
                    aria-expanded="false"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        viewBox="0 0 24 24"
                        class="menu-icon"
                        aria-hidden="true"
                    >
                        <path d="M3 5h18M3 12h18M3 19h18" />
                    </svg>
                </button>

                <nav class="desktop-nav" aria-label="Primary navigation">
                    <a href="#">Home</a>
                    <a href="#">About</a>
                    <a href="#">Contact</a>
                </nav>
            </header>

            <section class="hero" aria-label="Intro">
                <p>Welcome! This is a placeholder hero section.</p>
            </section>
        </div>

        <div class="drawer-backdrop" aria-hidden="true"></div>
        <aside class="drawer" id="nav-drawer" role="dialog"
            aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true" inert tabindex="-1">
            <div class="drawer-header">
                <span id="drawer-title">Menu</span>
                <button class="drawer-close" type="button" aria-label="Close navigation">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <nav aria-label="Mobile navigation">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </aside>

        <script type="module" src="js/main.js"></script>
    </body>
</html>
