name: Trigger auto deployment for blogportfolio

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/blogportfolio-AutoDeployTrigger-70a4a137-5206-4468-81ba-46b291502046.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BLOGPORTFOLIO_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BLOGPORTFOLIO_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BLOGPORTFOLIO_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: index.docker.io
          registryUsername: ${{ secrets.BLOGPORTFOLIO_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BLOGPORTFOLIO_REGISTRY_PASSWORD }}
          containerAppName: blogportfolio
          resourceGroup: portfolio-apps
          imageToBuild: index.docker.io/blogportfolio:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


